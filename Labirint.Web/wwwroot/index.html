<!DOCTYPE html>
<html data-theme="dark"
      lang="ru">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover"
          name="viewport" />
    <meta content="#14110d"
          name="theme-color" />
    <meta content="Браузерная игра-лабиринт: ищите выход, собирайте предметы, делитесь зерном партии."
          name="description" />
    <title>Лабиринт</title>
    <base href="/" />

    <meta content="website"
          property="og:type" />
    <meta content="Лабиринт"
          property="og:title" />
    <meta content="Браузерная игра-лабиринт: ищите выход, собирайте предметы, делитесь зерном партии."
          property="og:description" />
    <meta content="icon-512.png"
          property="og:image" />
    <meta content="summary"
          name="twitter:card" />

    <script type="importmap"></script>
    <link rel="preload"
          id="webassembly" />

    <link href="css/fonts.css"
          rel="stylesheet" />
    <link href="css/theme.css"
          rel="stylesheet" />
    <link href="css/ui.css"
          rel="stylesheet" />
    <link href="css/app.css"
          rel="stylesheet" />
    <link href="Labirint.Web.styles.css"
          rel="stylesheet" />

    <link href="favicon.png"
          rel="icon"
          type="image/png" />
    <link href="manifest.webmanifest"
          rel="manifest" />
    <link href="icon-512.png"
          rel="apple-touch-icon"
          sizes="512x512" />
    <link href="icon-192.png"
          rel="apple-touch-icon"
          sizes="192x192" />

    <script src="scripts/theme.js"></script>
    <script>labirintTheme.applyStored();</script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <svg class="boot__thread"
                 viewBox="0 0 200 200"
                 aria-hidden="true">
                <path d="M20 180 L20 20 L180 20 L180 180 L60 180 L60 60 L140 60 L140 140 L100 140" />
            </svg>
            <p class="boot__title">Лабиринт</p>
            <p class="boot__progress"></p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Произошло необработанное исключение.
        <a class="reload"
           href="">Перезагрузить</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>

    <script src="scripts/page.js"></script>
    <script src="scripts/sounds.js"></script>
    <script src="scripts/canvasHelper.js"></script>
    <script src="scripts/keyInterceptor.js"></script>
    <script src="scripts/dialogHost.js"></script>
    <script src="scripts/pickupFlight.js"></script>
</body>

</html>
